# Copie para config.toml e ajuste. Tudo pode ser sobrescrito por argumentos de linha de comando.
url_base = "https://link.tjac.jus.br/meta-{meta}"   # redireciona para estatistica.tjac.jus.br
meta = 1
pasta_saida = "saida"
timeout_s = 60

# Unidades (texto digitado no filtro "Unidade Judiciária"); cada item marcado será extraído junto.
termo_busca = "cruzeiro do sul"
unidades = ["1ª Vara Cível Cruzeiro Do Sul"]

# Seletores (ajuste aqui se o portal Alvank mudar o layout)
[seletores]
filtro_unidade = "text=Unidade Judiciária"
caixa_busca    = "input[placeholder*='esquis'], input[type='search'], input[type='text']"
botao_download = "text=Download"
